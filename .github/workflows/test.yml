name: Testes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar PostgreSQL para testes SQL
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Rodar suíte completa
        run: npm run test:all
